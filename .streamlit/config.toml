[logger]
level = "warning"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
headless = false
port = 8501
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 200

[theme]
primaryColor = "#00bcd4"
backgroundColor = "#f0f4f8"
secondaryBackgroundColor = "#e0f7fa"
textColor = "#0d1117"
font = "sans serif"
